<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>For You 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti"></canvas>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <main class="card">

    <!-- 1. Passcode gate -->
    <section id="gate" class="screen active">
      <div class="lock">🔒</div>
      <h2 class="gate-title">This page is just for you</h2>
      <p class="gate-question" id="gateQuestion"></p>
      <form id="gateForm" autocomplete="off">
        <input id="gateInput" type="text" placeholder="Your answer" aria-label="Your answer" required>
        <button class="btn" type="submit">Unlock 💌</button>
      </form>
      <p class="gate-error" id="gateError" aria-live="polite"></p>
    </section>

    <!-- 2. Gift -->
    <section id="intro" class="screen">
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open your gift">🎁</div>
      <p class="hint">Tap the gift, I made something for you</p>
    </section>

    <!-- 3. Message -->
    <section id="message" class="screen">
      <p class="small">Better late than never</p>
      <h1>Happy Belated Birthday,<br><span id="name">My Love</span>!</h1>
      <p class="letter" id="letter"></p>
      <p class="signature" id="signature"></p>

      <div class="buttons" id="mainButtons">
        <button id="wishBtn" class="btn">🎂 Make a wish</button>
        <button id="confettiBtn" class="btn ghost">🎉 More confetti</button>
      </div>

      <!-- Wish panel -->
      <div class="wish-panel" id="wishPanel" hidden>
        <p class="wish-prompt">Close your eyes, make a wish, then type it below.<br><small>It stays private. Nobody can see it.</small></p>
        <form id="wishForm" autocomplete="off">
          <input id="wishInput" type="text" placeholder="I wish..." aria-label="Your wish">
          <button class="btn" type="submit">✨ Seal my wish</button>
        </form>
      </div>

      <!-- Reveal after wish -->
      <div class="reveal" id="reveal" hidden>
        <p class="reveal-title" id="revealTitle"></p>
        <p class="reveal-text" id="revealText"></p>
        <div class="voucher">
          <div class="voucher-head" id="voucherTitle"></div>
          <div class="voucher-body" id="voucherBody"></div>
          <div class="voucher-foot" id="voucherNote"></div>
        </div>
      </div>
    </section>

  </main>

  <audio id="song" src="song.mp3" loop preload="auto"></audio>
  <button id="muteBtn" class="mute" aria-label="Mute or unmute music" hidden>🔊</button>

  <script src="script.js"></script>
</body>
</html>
